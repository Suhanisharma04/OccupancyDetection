<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Occupancy Detection Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 40px;
        }
        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 40px;
        }
        .card {
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border-radius: 15px;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: #007bff;
        }
        .card-body h5 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .card-body p {
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>

<!-- Logout Button -->
<div class="logout-btn">
    <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">Logout</a>
</div>

<!-- Header -->
<div class="dashboard-header">
    <h1>Occupancy Detection Dashboard</h1>
    <p>Welcome to the smart monitoring panel</p>
</div>

<!-- Cards -->
<div class="container">
    <div class="row g-4 justify-content-center">
        <!-- Temperature Card -->
        <div class="col-md-4">
            <div class="card text-center p-3">
                <div class="card-body">
                    <div class="icon"><i class="bi bi-thermometer-half"></i></div>
                    <h5 class="card-title">Room Temperature</h5>
                    <p class="card-text"><strong>{{ temperature }}</strong></p> <!-- This is where you put the temperature data -->
                    <a href="{{ url_for('temperature_page') }}" class="btn btn-outline-primary btn-sm">More Details</a>
                </div>
            </div>
        </div>

        <!-- Occupancy Card -->
        <div class="col-md-4">
            <div class="card text-center p-3">
                <div class="card-body">
                    <div class="icon"><i class="bi bi-people-fill"></i></div>
                    <h5 class="card-title">Room Occupancy</h5>
                    <p class="card-text"><strong>{{ occupancy }}</strong></p> <!-- This is where you put the occupancy data -->
                    <a href="{{ url_for('occupancy_page') }}" class="btn btn-outline-primary btn-sm">More Details</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
