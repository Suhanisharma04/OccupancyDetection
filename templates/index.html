<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Office Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/toolkit.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #f4f6f8, #e8ecf0);
        }

        .logout-container {
            position: absolute;
            top: 20px;
            right: 30px;
        }

        .dashboard-container {
            max-width: 1000px;
            margin: 80px auto;
            text-align: center;
        }

        .dashboard-container h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
            color: #333;
        }

        .card-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .card-box {
            width: 300px;
            height: 180px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #333;
        }

        .card-box:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .card-box h4 {
            font-size: 1.4rem;
        }

        .card-box i {
            font-size: 1.8rem;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <div class="logout-container">
        <form action="{{ url_for('logout') }}" method="get">
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>

    <div class="dashboard-container">
        <h1>Smart Office Dashboard</h1>

        <div class="card-row">
            <!-- Occupancy Card -->
            <a href="{{ url_for('occupancy') }}" class="card-box">
                <h4><i class="bi bi-door-open"></i> Room Occupancy</h4>
            </a>

            <!-- Temperature Card -->
            <a href="{{ url_for('temperature') }}" class="card-box">
                <h4><i class="bi bi-thermometer-half"></i> Temperature</h4>
            </a>
        </div>
    </div>

</body>
</html>
